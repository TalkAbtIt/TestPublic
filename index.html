<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Grand Harmony Homes Lockup</title>
<meta name="description" content="Interactive logo lockup for Grand Harmony Homes: full color with editable hex values, plus monotone white-on-black and black-on-white.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #F4F5F8;
    --panel: #FFFFFF;
    --ink: #17182B;
    --muted: #6A6E86;
    --line: #DADCE6;
    --line-strong: #C3C6D4;
    --field: #FFFFFF;
    --accent: #28615E;
    --accent-ink: #FFFFFF;
    --indigo: #140F5B;
    --focus: #2F8F89;
    --shadow: 0 1px 2px rgba(20,15,91,.06), 0 8px 24px rgba(20,15,91,.06);
    --radius: 10px;
    --sans: "Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151D;
      --panel: #1D1F2A;
      --ink: #EEEFF5;
      --muted: #9DA1B8;
      --line: #2D3040;
      --line-strong: #3C4053;
      --field: #171922;
      --accent: #5FB3AC;
      --accent-ink: #0F1A19;
      --focus: #7BCBC4;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151D;
    --panel: #1D1F2A;
    --ink: #EEEFF5;
    --muted: #9DA1B8;
    --line: #2D3040;
    --line-strong: #3C4053;
    --field: #171922;
    --accent: #5FB3AC;
    --accent-ink: #0F1A19;
    --focus: #7BCBC4;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  header.top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 28px 32px 8px;
  }
  header.top h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin: 0; }
  header.top h1 span { color: var(--muted); font-weight: 600; }
  header.top .meta { color: var(--muted); font-size: 12.5px; }

  .app { display: flex; flex-direction: column; gap: 28px; padding: 16px 32px 56px; }
  @media (max-width: 860px) { .app { padding: 12px 16px 40px; } header.top { padding: 20px 16px 4px; } }

  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 12px;
  }

  /* ---------- lockups: one row ---------- */
  .hero { display: flex; justify-content: center; }
  .hero section.lockup { width: 100%; max-width: 760px; }
  .hero .stage svg.logo { max-width: 640px; }
  .lockups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  @media (max-width: 860px) { .lockups { grid-template-columns: 1fr; } }
  section.lockup {
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; background: var(--panel); display: flex; flex-direction: column;
  }
  section.lockup .head {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  section.lockup .head h2 { margin: 0; font-size: 13px; font-weight: 800; }
  section.lockup .head .sub { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 600; }
  .stage { padding: clamp(24px, 4vw, 44px) clamp(18px, 4vw, 40px); display: flex; justify-content: center; flex: 1; background: var(--stage, #FFFFFF); }
  .stage svg.logo { width: 100%; max-width: 560px; height: auto; display: block; }
  .stage.dark { --stage: #000000; }
  .stage.light { --stage: #FFFFFF; }
  .legend { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
  .chip { display: flex; align-items: center; gap: 9px; }
  .chip .dot { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-strong); }
  .chip .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .chip .val { font-family: var(--mono); font-size: 12.5px; }

  /* ---------- color controls: one row, sliders under each ---------- */
  .colors { display: flex; justify-content: center; }
  .colors .color-ctl { width: 100%; max-width: 760px; }
  select {
    font: inherit; font-weight: 700; font-size: 13px; color: var(--ink); background: var(--field);
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 30px 6px 10px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .color-ctl .top { display: flex; align-items: center; gap: 12px; }
  .color-ctl .hex input { width: 7.5ch; min-width: 7.5ch; max-width: none; flex: none; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin: -4px -18px 4px; padding: 0 10px; }
  .tabs button {
    border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--muted);
    padding: 8px 12px 10px; margin-bottom: -1px; font-size: 13px;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .exports { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .exports button { font-weight: 600; color: var(--muted); }
  .color-ctl {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .color-ctl .top { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
  .swatch {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-strong);
    position: relative; overflow: hidden; cursor: pointer; background: var(--sw, #000);
  }
  .swatch input[type="color"] {
    position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px);
    opacity: 0; cursor: pointer; border: 0; padding: 0;
  }
  .color-ctl label.name { font-weight: 700; font-size: 13px; display: block; margin-bottom: 4px; }
  .hex { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 13px; }
  .hex input {
    width: 100%; font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; text-transform: uppercase; letter-spacing: .02em;
  }
  .hex input:invalid { border-color: #C0392B; }
  .sliders { display: grid; gap: 8px; }
  .sl { display: grid; grid-template-columns: 16px 1fr 36px; gap: 10px; align-items: center; font-size: 11.5px; color: var(--muted); }
  .sl output { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
  input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--track, var(--line)); border: 1px solid var(--line); }
  input[type="range"]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--track, var(--line)); border: 1px solid var(--line); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 2px solid var(--ink); }
  input[type="range"]:disabled { opacity: .5; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .check input { accent-color: var(--accent); margin: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; font-weight: 700; font-size: 12.5px; color: var(--ink); background: var(--field);
    border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--ink); }
  .segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
  .segmented button { border: 0; border-radius: 0; padding: 6px 12px; background: var(--field); }
  .segmented button + button { border-left: 1px solid var(--line-strong); }
  .segmented button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

  /* ---------- subtext details ---------- */
  .subtext {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    max-width: 760px; margin: 0 auto; padding: 16px 18px; display: grid; grid-template-columns: minmax(200px, 360px) auto auto; gap: 14px 32px; align-items: end;
  }
  @media (max-width: 860px) { .subtext { grid-template-columns: 1fr; align-items: start; } }
  .subtext .field > .lbl { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .hint { font-size: 11.5px; color: var(--muted); margin: 0; grid-column: 1 / -1; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 12.5px;
    opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
</style>
</head>

<header class="top">
  <h1>Grand Harmony Homes <span>· Logo Lockup</span></h1>
</header>

<div class="app">
  <div class="hero">
    <section class="lockup" id="panel-color">
      <div class="stage light">
        <svg class="logo" id="logo-color" role="img" aria-label="Grand Harmony Homes logo, full color" style="--icon:#28615E;--name:#140F5B;--sub:#140F5B"><use href="#ghh-logo"/></svg>
      </div>
    </section>
  </div>

  <div class="colors">
    <div class="color-ctl" id="color-ctl">
      <div class="tabs" role="tablist" aria-label="Which part to color">
        <button type="button" role="tab" data-target="icon" aria-selected="true">Icon</button>
        <button type="button" role="tab" data-target="name" aria-selected="false">Name</button>
        <button type="button" role="tab" data-target="sub" aria-selected="false">Subtext</button>
      </div>
      <div class="top">
        <div class="swatch" style="--sw:#28615E"><input type="color" value="#28615e" aria-label="Color picker"></div>
        <div class="hex">#<input id="hex" type="text" value="28615E" maxlength="6" pattern="[0-9a-fA-F]{6}" spellcheck="false" aria-label="Hex value"></div>
      </div>
      <div class="sliders">
        <label class="sl">H <input type="range" data-ch="h" min="0" max="360" step="1"><output>0</output></label>
        <label class="sl">S <input type="range" data-ch="s" min="0" max="100" step="1"><output>0</output></label>
        <label class="sl">L <input type="range" data-ch="l" min="0" max="100" step="1"><output>0</output></label>
      </div>
      <label class="check"><input type="checkbox" id="lock-sub" checked> Subtext uses the same color as the name</label>
    </div>
  </div>

  <div class="subtext">
    <div class="field">
      <div class="lbl">Subtext letter spacing</div>
      <label class="sl">Track <input type="range" id="track" min="-120" max="60" step="1" value="0"><output id="track-out">0</output></label>
    </div>
    <div class="field">
      <div class="lbl">Alignment</div>
      <div class="segmented" role="group" aria-label="Subtext alignment">
        <button type="button" data-align="left" aria-pressed="true">Left</button>
        <button type="button" data-align="center" aria-pressed="false">Center</button>
      </div>
    </div>
    <div class="field">
      <div class="lbl">Preset</div>
      <div class="segmented" role="group" aria-label="Subtext preset">
        <button type="button" data-preset="A">Design A</button>
        <button type="button" data-preset="B">Design B</button>
      </div>
    </div>
  </div>

  <div class="lockups">
    <section class="lockup" id="panel-wob">
      <div class="stage dark">
        <svg class="logo" role="img" aria-label="Grand Harmony Homes logo, white on black" style="--icon:#FFFFFF;--name:#FFFFFF;--sub:#FFFFFF"><use href="#ghh-logo"/></svg>
      </div>
    </section>
    <section class="lockup" id="panel-bow">
      <div class="stage light">
        <svg class="logo" role="img" aria-label="Grand Harmony Homes logo, black on white" style="--icon:#000000;--name:#000000;--sub:#000000"><use href="#ghh-logo"/></svg>
      </div>
    </section>
  </div>

  <div class="exports">
    <button type="button" data-dl="color">Download full color SVG</button>
    <button type="button" data-dl="wob">Download white on black</button>
    <button type="button" data-dl="bow">Download black on white</button>
    <button type="button" data-copy="color">Copy full color SVG</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var VB_W = 6155;
  var SUB_START = 150.545;   // left edge of the first subtext glyph in the source art
  var SUB_WIDTH = 5264.115;  // width of the untracked subtext run
  var GLYPHS = 22;

  var state = {
    icon: '#28615E', name: '#140F5B', sub: '#140F5B',
    lock: true, track: 0, align: 'left'
  };
  try {
    var saved = JSON.parse(localStorage.getItem('ghh-lockup') || 'null');
    if (saved && typeof saved === 'object') Object.assign(state, saved);
  } catch (e) {}

  // ---------- color math ----------
  function hexToRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgbToHex(r, g, b) { return '#' + [r, g, b].map(function (v) { return Math.round(v).toString(16).padStart(2, '0'); }).join('').toUpperCase(); }
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), h = 0, s = 0, l = (max + min) / 2, d = max - min;
    if (d) {
      s = l > .5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s * 100, l * 100];
  }
  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r, g, b;
    if (h < 60) { r = c; g = x; b = 0; } else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; } else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }
  function normHex(v) {
    v = String(v || '').trim().replace(/^#/, '');
    if (/^[0-9a-f]{3}$/i.test(v)) v = v.replace(/./g, function (c) { return c + c; });
    return /^[0-9a-f]{6}$/i.test(v) ? '#' + v.toUpperCase() : null;
  }

  // ---------- elements ----------
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var logoColor = $('#logo-color');
  var target = 'icon';
  var ctlEl = $('#color-ctl');
  var c = {
    swatch: $('.swatch', ctlEl), picker: $('input[type=color]', ctlEl), hex: $('#hex'),
    h: $('input[data-ch=h]', ctlEl), s: $('input[data-ch=s]', ctlEl), l: $('input[data-ch=l]', ctlEl),
    outs: $$('output', ctlEl)
  };

  function setColor(hex, from) {
    state[target] = hex;
    if (target === 'name' && state.lock) state.sub = hex;
    render(from);
    persist();
  }

  function renderCtl(from) {
    var hex = state[target], rgb = hexToRgb(hex), hsl = rgbToHsl(rgb[0], rgb[1], rgb[2]);
    c.swatch.style.setProperty('--sw', hex);
    if (from !== c.picker) c.picker.value = hex.toLowerCase();
    if (from !== c.hex) c.hex.value = hex.slice(1);
    // keep the hue slider steady for greys, where hue is undefined
    if (from !== c.h && from !== c.s && from !== c.l) {
      if (hsl[1] > 0.5 || from === 'switch') c.h.value = Math.round(hsl[0]);
      c.s.value = Math.round(hsl[1]); c.l.value = Math.round(hsl[2]);
    }
    c.outs[0].value = c.h.value; c.outs[1].value = c.s.value; c.outs[2].value = c.l.value;
    var h = +c.h.value;
    c.h.style.setProperty('--track', 'linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)');
    c.s.style.setProperty('--track', 'linear-gradient(90deg,hsl(' + h + ',0%,' + c.l.value + '%),hsl(' + h + ',100%,' + c.l.value + '%))');
    c.l.style.setProperty('--track', 'linear-gradient(90deg,#000,hsl(' + h + ',' + c.s.value + '%,50%),#fff)');
    var dis = target === 'sub' && state.lock;
    [c.picker, c.hex, c.h, c.s, c.l].forEach(function (i) { i.disabled = dis; });
    $('.top', ctlEl).style.opacity = dis ? .55 : 1;
    $('.sliders', ctlEl).style.opacity = dis ? .55 : 1;
  }

  function render(from) {
    renderCtl(from);
    logoColor.style.setProperty('--icon', state.icon);
    logoColor.style.setProperty('--name', state.name);
    logoColor.style.setProperty('--sub', state.sub);
    $('#lock-sub').checked = state.lock;
    $('#track').value = state.track; $('#track-out').value = state.track;
    $$('[data-align]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.align === state.align)); });
    layoutSub();
  }

  function subOffset() {
    var w = SUB_WIDTH + (GLYPHS - 1) * state.track;
    return state.align === 'center' ? (VB_W - w) / 2 - SUB_START : 0;
  }
  function layoutSub() {
    var off = subOffset();
    $$('#lg-sub .gl').forEach(function (g) {
      var dx = off + (+g.dataset.i) * state.track;
      g.setAttribute('transform', 'translate(' + dx.toFixed(2) + ' 0)');
    });
  }

  function persist() { try { localStorage.setItem('ghh-lockup', JSON.stringify(state)); } catch (e) {} }

  // ---------- wire controls ----------
  $$('.tabs [data-target]').forEach(function (b) {
    b.addEventListener('click', function () {
      target = b.dataset.target;
      $$('.tabs [data-target]').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
      render('switch');
    });
  });
  c.picker.addEventListener('input', function () { setColor(c.picker.value.toUpperCase(), c.picker); });
  c.hex.addEventListener('input', function () { var h = normHex(c.hex.value); if (h) setColor(h, c.hex); });
  c.hex.addEventListener('blur', function () { c.hex.value = state[target].slice(1); });
  [c.h, c.s, c.l].forEach(function (r) {
    r.addEventListener('input', function () {
      var rgb = hslToRgb(+c.h.value, +c.s.value, +c.l.value);
      setColor(rgbToHex(rgb[0], rgb[1], rgb[2]), r);
    });
  });
  $('#lock-sub').addEventListener('change', function (e) {
    state.lock = e.target.checked; if (state.lock) state.sub = state.name; render(); persist();
  });
  $('#track').addEventListener('input', function (e) { state.track = +e.target.value; render(); persist(); });
  $$('[data-align]').forEach(function (b) { b.addEventListener('click', function () { state.align = b.dataset.align; render(); persist(); }); });
  $$('[data-preset]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.preset === 'A') { state.track = 0; state.align = 'left'; }
      else { state.track = -100; state.align = 'center'; }
      render(); persist();
    });
  });

  // ---------- export ----------
  function buildSvg(variant) {
    var cols = variant === 'wob' ? { icon: '#FFFFFF', name: '#FFFFFF', sub: '#FFFFFF' }
             : variant === 'bow' ? { icon: '#000000', name: '#000000', sub: '#000000' }
             : { icon: state.icon, name: state.name, sub: state.sub };
    var inner = $('#ghh-logo').innerHTML
      .replace(/style="fill:var\(--icon\)"/g, 'fill="' + cols.icon + '"')
      .replace(/style="fill:var\(--name\)"/g, 'fill="' + cols.name + '"')
      .replace(/style="fill:var\(--sub\)"/g, 'fill="' + cols.sub + '"')
      .replace(/ class="gl" data-i="\d+" data-ch="[A-Za-z]"/g, '')
      .replace(/ transform="translate\(0\.00 0\)"/g, '');
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + VB_W + ' 3361" width="' + VB_W + '" height="3361">\n' +
      '<title>Grand Harmony Homes - Assisted Living Facility</title>\n' + inner.trim() + '\n</svg>\n';
  }
  function fileName(variant) {
    var n = { color: 'full-color-' + state.icon.slice(1) + '-' + state.name.slice(1), wob: 'white-on-black', bow: 'black-on-white' }[variant];
    return 'grand-harmony-homes-lockup-' + n + '.svg';
  }
  var toastT;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function copyText(txt, label) {
    var done = function () { toast(label + ' copied'); };
    var fail = function () { toast('Copy blocked in this viewer'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fail);
    else fail();
  }
  $$('[data-dl]').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = b.dataset.dl, blob = new Blob([buildSvg(v)], { type: 'image/svg+xml' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName(v);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast('Downloading ' + fileName(v));
    });
  });
  $$('[data-copy]').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = b.dataset.copy;
      copyText(buildSvg(v), 'SVG');
    });
  });

  render('switch');
})();
</script>
